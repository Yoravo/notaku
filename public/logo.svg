  <line x1="178" y1="89" x2="212" y2="89" stroke="#0f6b4f" stroke-width="6" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(15, 107, 79);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  
