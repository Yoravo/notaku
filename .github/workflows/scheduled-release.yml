name: Scheduled Commit Releaser

on:
  schedule:
    # Berjalan setiap hari jam 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  release-next-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Advance Main by 1 Commit from Queue
        run: |
          # Refresh referensi remote-tracking (bukan ke refs/heads langsung,
          # supaya tidak konflik dengan branch 'main' yang sedang checkout)
          git fetch origin main:refs/remotes/origin/main
          git fetch origin queue:refs/remotes/origin/queue

          # Cari commit di queue yang PATCH-nya belum ada di main
          # (pakai git cherry, bukan git log, supaya tahan terhadap
          # SHA yang berubah akibat cherry-pick sebelumnya)
          NEXT_COMMIT=$(git cherry origin/main origin/queue | awk '/^\+/ {print $2; exit}')

          if [ -z "$NEXT_COMMIT" ]; then
            echo "Semua commit dari branch 'queue' sudah berada di 'main'. Tidak ada rilis baru."
            exit 0
          fi

          echo "Menerapkan commit: $NEXT_COMMIT ke branch main"
          git cherry-pick --allow-empty "$NEXT_COMMIT"
          git push origin main